<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Council Tax Explorer{% endblock %} – England</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ url_for('index') }}" class="logo">🏛 Council Tax Explorer</a>
      <nav class="main-nav">
        <a href="{{ url_for('index') }}" {% if request.endpoint=='index' %}class="active"{% endif %}>Home</a>
        <a href="{{ url_for('authorities') }}" {% if request.endpoint=='authorities' %}class="active"{% endif %}>Authorities</a>
        <a href="{{ url_for('regions') }}" {% if request.endpoint in ('regions','region_detail') %}class="active"{% endif %}>Regions</a>
        <a href="{{ url_for('compare') }}" {% if request.endpoint=='compare' %}class="active"{% endif %}>Compare</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Data: <a href="https://www.gov.uk/government/collections/council-tax-statistics" target="_blank" rel="noopener">MHCLG Council Tax Statistics</a> (Open Government Licence v3.0). Covers 296 English local authorities, 2025-26 and 2026-27.</p>
    </div>
  </footer>
</body>
</html>
